<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page not found | Fixing Friction</title>
<style>
  :root{--navy:#101F3C;--blue:#2A48AB;--ink:#1C1A17;--muted:#475569;--bg:#FFFFFF;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
  main{max-width:38rem;margin:0 auto;padding:12vh 24px 64px}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin:0 0 12px}
  h1{font-size:2rem;line-height:1.2;margin:0 0 14px;color:var(--navy)}
  p{margin:0 0 16px;color:var(--muted);font-size:1.08rem}
  a.btn{display:inline-block;min-height:44px;padding:11px 24px;border-radius:999px;background:var(--blue);color:#FFFFFF;font-weight:700;text-decoration:none}
  a.btn:hover{background:var(--navy)}
  a:focus-visible{outline:3px solid #7DD3FC;outline-offset:3px}
  a.text{color:var(--blue);font-weight:600}
</style>
<script>
/* Old or typed addresses such as /audits.html or /assessments land on the real page. */
(function () {
  var pages = ["home", "voting", "speaking", "selfeval", "events", "buildout-page", "method", "frictions", "frictions-quiz", "frictions-results", "scorecard", "services", "verticals", "pathways", "audits", "advising", "support", "materials", "plans", "findings", "communications", "cohesion", "training", "modules", "titles", "reporting", "evidence", "about", "start", "inside", "tools", "community", "debt", "keydates", "athome", "burnout", "scorecards", "ai-scorecards"];
  var alias = {"assessments": "audits", "consulting": "advising", "carecircle": "buildout-page", "brainblame": "buildout-page", "app": "buildout-page", "prototypes": "buildout-page", "apps": "buildout-page", "accessibility-audits": "audits", "contact": "start", "get-started": "start", "pricing": "start", "services-and-pricing": "services", "faq": "about", "ada-training": "training", "keynote": "speaking", "voting-places": "voting"};
  var seg = (location.pathname || "").replace(/^\/+|\/+$/g, "").toLowerCase().split("/")[0];
  seg = seg.replace(/\.html?$/, "");
  var id = alias[seg] || (pages.indexOf(seg) !== -1 ? seg : "");
  if (id) location.replace(id === "home" ? "/" : "/" + id.replace(/^frictions-/, "frictions/") + "/");
})();
</script>
</head>
<body>
<main>
  <p class="eyebrow">Fixing Friction</p>
  <h1>We could not find that page.</h1>
  <p>The link may be old or mistyped. Everything on this site starts from the home page, and the Scorecard will point you to the right first step.</p>
  <p><a class="btn" href="/">Go to the home page</a></p>
  <p>Still stuck? Email <a class="text" href="mailto:hello@fixingfriction.com">hello@fixingfriction.com</a>.</p>
</main>
</body>
</html>
