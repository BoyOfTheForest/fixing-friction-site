name: Site check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the site check (Chrome is preinstalled on the runner)
        run: CHROME=$(which google-chrome || which chromium) node tools/check.mjs
      - name: Generated pages match the source build
        run: node tools/build.mjs --check
      - name: Every page is readable with JavaScript off
        run: CHROME=$(which google-chrome || which chromium) node tools/crawl_nojs.mjs
      - name: Real pages click inventory
        run: CHROME=$(which google-chrome || which chromium) node tools/realpages_check.mjs
